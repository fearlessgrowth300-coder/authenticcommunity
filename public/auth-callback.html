<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentic - Redirecting...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #F8FAFC;
      color: #0F172A;
      text-align: center;
      padding: 1.5rem;
    }
    .card {
      background: #FFFFFF;
      padding: 2.5rem;
      border-radius: 1rem;
      border: 1px solid #E2E8F0;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #E2E8F0;
      border-top-color: #4F46E5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.95rem;
      color: #64748B;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-block;
      background: #4F46E5;
      color: #FFFFFF;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-weight: 600;
      font-size: 0.95rem;
    }
  </style>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const hash = window.location.hash || '';
      const search = window.location.search || '';
      const deepLinkUrl = 'authentic://auth/callback' + search + hash;
      
      // Attempt automatic redirect to mobile app
      setTimeout(() => {
        window.location.href = deepLinkUrl;
      }, 500);

      document.getElementById('manual-btn').href = deepLinkUrl;
    });
  </script>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>Opening Authentic App...</h2>
    <p>We are redirecting you back to your Authentic mobile application.</p>
    <a id="manual-btn" href="authentic://auth/callback" class="btn">Open App</a>
  </div>
</body>
</html>
